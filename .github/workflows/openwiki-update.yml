name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: [self-hosted, axis]
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.2.3 mermaid@11.16.0 jsdom@29.1.1

      - name: Open LiteLLM tunnel to cranium
        # The self-hosted runner (nixos) SSH-tunnels cranium's loopback LiteLLM
        # hub to a local port. cranium.local resolves on the LAN; the runner's
        # axis@nixos SSH key is already authorized on cranium@cranium.local.
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ExitOnForwardFailure=yes \
              -N -L 11400:127.0.0.1:4000 cranium@cranium.local &
          echo $! > /tmp/litellm-tunnel.pid
          # Wait for the forward to come up
          for i in $(seq 1 20); do
            if curl -sS --max-time 1 http://127.0.0.1:11400/v1/models >/dev/null 2>&1; then
              echo "LiteLLM tunnel up on 127.0.0.1:11400"
              exit 0
            fi
            sleep 0.5
          done
          echo "LiteLLM tunnel failed to come up" >&2
          exit 1

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_BASE_URL: http://127.0.0.1:11400/v1
          OPENAI_API_KEY: local
          OPENWIKI_MODEL_ID: qwythos
          # Fallback model if qwythos is OOM'd by other GPU residents: qwen3-coder

      - name: Close LiteLLM tunnel
        if: always()
        run: |
          if [ -f /tmp/litellm-tunnel.pid ]; then
            kill "$(cat /tmp/litellm-tunnel.pid)" 2>/dev/null || true
            rm -f /tmp/litellm-tunnel.pid
          fi

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
            Model: local `qwythos` via cranium LiteLLM (SSH-tunneled from nixos runner).
