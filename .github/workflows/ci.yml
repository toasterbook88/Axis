name: CI

# Push only on main (avoid double-running the full suite for every in-repo PR
# push). PRs use pull_request; merge queue uses merge_group.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Lint (gofmt + go vet + staticcheck)
        run: make lint

      # Via make, not a bare `go test`: the Makefile targets set AXIS_HOME to a
      # disposable directory (audit finding C5). A second, unisolated
      # definition here would drift from the operator's default command.
      - name: Run tests
        run: make test

      - name: Run race tests
        run: make test-race

      - name: Run install regression tests
        run: make test-install

      - name: Build
        run: go build -buildvcs=false ./...

      - name: Coverage gates
        run: ./hack/coverage-check.sh

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Repo truth guardrails
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./hack/verify-repo-truth.sh

      - name: Doc facts guardrails
        run: ./hack/verify-doc-facts.sh

      - name: Claude workflow security guardrails
        run: python3 hack/claude-workflow-tests.py

      - name: Workflow Action pin guardrails
        run: python3 hack/workflow-action-pins.py

      - name: Validate GitHub Actions syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lifecycle lint
        run: go run hack/lifecycle-check.go
